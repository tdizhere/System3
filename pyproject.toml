[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system3"
version = "0.1.0"
description = "A Neural architecture coupling a JEPA-style predictive-coding System 1 state router with an autoregressive System 2 transformer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["system3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
